name: Verified

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]

permissions:
  pull-requests: write
  checks: read

# The last event decides the final status. Every run decides from the live state (draft, labels, and
# whether the label is older than the head commit), never from its own event, so a cancelled run
# cannot leave a stale label counting.
concurrency:
  group: verified-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verified:
    name: Verificado
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the verificado label
        # Branch, author, labels and draft state go through env, never inline in the script, to avoid injection.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # Only a branch of this repository can be the release PR (a fork could use the same branch name).
          PR_HEAD_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PR_HEAD_REF" in
            release-please--branches--main--components--trailskill) echo "Release PR: exempt."; exit 0 ;;
          esac
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: exempt."
            exit 0
          fi
          # Draft state, head commit and labels come from the API, not from the event payload, which can
          # be stale. A failed call fails the step (set -e): never read as «verified».
          tab=$(printf '\t')
          live=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '[.draft, .head.sha, ([.labels[].name] | join(","))] | @tsv')
          PR_DRAFT=${live%%"$tab"*}
          rest=${live#*"$tab"}
          HEAD_SHA=${rest%%"$tab"*}
          PR_LABELS=${rest#*"$tab"}
          has_label=false
          case ",$PR_LABELS," in
            *,verificado,*) has_label=true ;;
          esac
          stale=false
          if [ "$has_label" = true ] && [ "$PR_ACTION" != synchronize ]; then
            # The label counts only if it was added after the head commit arrived. ISO 8601 UTC strings
            # compare as text. A missing timestamp reads as stale (fail closed).
            labeled_at=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/events" --jq '.[] | select(.event == "labeled" and .label.name == "verificado") | .created_at' | tail -n 1)
            # --paginate runs --jq once per page, so the earliest time is taken over all pages after the
            # call (sed, not head: head would close the pipe early and trip pipefail).
            head_at=$(gh api --paginate "repos/$GH_REPO/commits/$HEAD_SHA/check-suites?per_page=100" --jq '.check_suites[].created_at' | sort | sed -n 1p)
            if [ -z "$labeled_at" ] || [ -z "$head_at" ] || [[ ! "$labeled_at" > "$head_at" ]]; then
              stale=true
            fi
          fi
          if [ "$has_label" = true ] && { [ "$PR_ACTION" = synchronize ] || [ "$stale" = true ]; }; then
            gh api -X DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/verificado" --silent
            echo "::error::The head commit is newer than the verificado label: the pull request must be verified again and the label added again."
            exit 1
          fi
          if [ "$PR_DRAFT" = true ]; then
            echo "::error::The pull request is a draft: finish it, mark it ready and add the verificado label."
            exit 1
          fi
          if [ "$has_label" != true ]; then
            echo "::error::Missing the verificado label: the orchestrator adds it after the verifier, the cross review, the fixes and the emulator check."
            exit 1
          fi
          echo "Verified."
