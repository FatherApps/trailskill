name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-rules:
    name: PR title and linked issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check title and description
        # Title and body go through env, never inline in the script, to avoid injection.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # Only a branch of this repository can be the release PR (a fork could use the same branch name).
          PR_HEAD_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}
        run: sh .github/scripts/check-pr.sh

  ota-check:
    name: OTA or Play build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the delivery box against the diff
        # The description and the PR number go through env, never inline in the script, to avoid injection.
        # The base and head are read from the API at run time: an event can arrive after the PR was merged
        # (its head commit is then gone from the branches) or after the branches moved.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || '' }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          # A failed API call must fail the step (set -e), never read as "not open": assign first, then split.
          pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '[.state, .base.ref, .base.sha, .head.sha] | join(" ")')
          read -r state BASE_REF BASE_SHA HEAD_SHA <<EOF
          $pr
          EOF
          if [ -z "$HEAD_SHA" ]; then echo "::error::could not read PR #$PR_NUMBER" >&2; exit 1; fi
          if [ "$state" != open ]; then
            echo "PR #$PR_NUMBER is $state, not open: nothing to check."
            exit 0
          fi
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head" "$BASE_REF"
          export BASE_SHA HEAD_SHA
          sh .github/scripts/check-ota.sh

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz
      - name: Scan history
        run: gitleaks git --redact --verbose .
