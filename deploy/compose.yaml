# Deployed by Dokploy from GitHub on every push to main (compose path: deploy/compose.yaml).
# The Supabase stack (with Mailpit and the email templates inside it) is NOT here: it comes from Dokploy (see deploy/README.md).
# Dokploy clones the repo and writes the service environment to deploy/.env, so each service
# mounts only the folders it needs, never the whole repository. Every secret comes from the
# service environment in Dokploy; nothing sensitive is stored in this repository.

name: trailskill-deploy

# One image for `migrate` and `backup` (same pattern as `powersync`): the Postgres client tools plus age and rclone,
# which backup-prod.sh and backup-r2.sh need. The build context holds only the crontab.
x-backup-tools: &backup-tools
  build:
    context: ./backup
    dockerfile_inline: |
      FROM postgres:17-alpine
      RUN apk add --no-cache age rclone
  image: trailskill-deploy-backup-tools
  pull_policy: build # always build on `compose up`; an unchanged Dockerfile reuses the cached image

# Copy settings, taken from the service environment in Dokploy by name only (nothing sensitive is stored here).
# Unset is fine while BACKUP_BEFORE_MIGRATE=off (local); with `required` a missing value makes the backup refuse.
x-backup-env: &backup-env
  TMPDIR: /backup-tmp # tmpfs, see below: the plain dump never reaches a disk
  BACKUP_PUSH_CMD: sh /scripts/backup-r2.sh "$$0" "$$@"
  BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
  BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
  BACKUP_MIN_COUNTS: ${BACKUP_MIN_COUNTS:-}
  BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
  RCLONE_CONFIG_R2_TYPE: ${RCLONE_CONFIG_R2_TYPE:-}
  RCLONE_CONFIG_R2_PROVIDER: ${RCLONE_CONFIG_R2_PROVIDER:-}
  RCLONE_CONFIG_R2_ENDPOINT: ${RCLONE_CONFIG_R2_ENDPOINT:-}
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:-}
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: ${RCLONE_CONFIG_R2_NO_CHECK_BUCKET:-true} # a bucket-scoped token cannot create buckets

services:
  # One-shot: takes a verified backup when migrations are pending, then prepares powersync_role, applies
  # supabase/migrations and optionally the seed. A failed backup stops it before anything is applied.
  migrate:
    <<: *backup-tools
    restart: "no"
    command: ["sh", "/scripts/migrate.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - ../supabase:/repo/supabase:ro
      - backup-lock:/backup-lock
    tmpfs:
      - /backup-tmp:mode=700
    environment:
      <<: *backup-env
      BACKUP_BEFORE_MIGRATE: ${BACKUP_BEFORE_MIGRATE:?Set BACKUP_BEFORE_MIGRATE to required (or off, only for a database without real data)}
      BACKUP_LOCK_WAIT_SECONDS: ${BACKUP_LOCK_WAIT_SECONDS:-600}
      BACKUP_PGUSER: ${BACKUP_PGUSER:-}
      BACKUP_PGPASSWORD: ${BACKUP_PGPASSWORD:-}
      PGHOST: ${SUPABASE_DB_HOST:?Set SUPABASE_DB_HOST to the Supabase database host on the supabase network (db)}
      PGPORT: ${SUPABASE_DB_PORT:-5432}
      PGUSER: ${SUPABASE_DB_USER:-postgres}
      PGPASSWORD: ${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD}
      PGDATABASE: ${SUPABASE_DB_NAME:-postgres}
      POWERSYNC_DB_PASSWORD: ${POWERSYNC_DB_PASSWORD:?Set POWERSYNC_DB_PASSWORD}
      APPLY_SEED: ${APPLY_SEED:-false}
    networks:
      - supabase

  # One-shot: delivers the Edge Functions (deploy/scripts/functions-bundle.sh) into the functions folder of the Supabase stack.
  # It runs after migrate, so it never delivers code for a migration that failed. The script checks every function (deno check)
  # before it replaces any, so a failure leaves the folder as it was. The Deno image runs the check itself: no Docker socket.
  # No database, no secret: only the repository files it needs (read-only) and the one folder it writes. The only network is
  # `default`, so `deno check` reaches npm and jsr. Local mode leaves it out (compose.local.yaml).
  functions:
    image: denoland/deno:2.1.4 # same version as DENO_VERSION in functions-bundle.sh and the edge-runtime the stack runs
    restart: "no"
    command: ["sh", "/repo/deploy/scripts/functions-bundle.sh", "/functions"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/repo/deploy/scripts:ro
      - ../supabase:/repo/supabase:ro
      - ../src/core/sport/catalogs.ts:/repo/src/core/sport/catalogs.ts:ro
      - ${SUPABASE_FUNCTIONS_DIR:?Set SUPABASE_FUNCTIONS_DIR to the host folder the Supabase stack functions service mounts at /home/deno/functions}:/functions
    networks:
      - default

  # Turns a failed delivery into a failed `docker compose up`, so the Dokploy deployment shows red. powersync does not depend on it.
  functions-ok:
    image: busybox:1.37.0
    restart: "no"
    command: ["true"]
    depends_on:
      functions:
        condition: service_completed_successfully
    networks:
      - default

  # Bucket storage for PowerSync (separate from the app database).
  powersync-storage:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: powersync_storage
      POSTGRES_DB: powersync_storage
      POSTGRES_PASSWORD: ${POWERSYNC_STORAGE_PASSWORD:?Set POWERSYNC_STORAGE_PASSWORD}
    volumes:
      - powersync-storage-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powersync_storage -d powersync_storage"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  powersync:
    # Built from the pinned image with powersync/sync-config.yaml copied in. A deploy that changes
    # that file builds a new image, so Compose recreates the container and PowerSync loads the new
    # config. A bind mount would not: Compose does not recreate a container when a mounted file changes.
    build:
      context: ../powersync
      dockerfile_inline: |
        FROM journeyapps/powersync-service:1.21.0
        COPY sync-config.yaml /sync/sync-config.yaml
    pull_policy: build # always build on `compose up`, with or without --build; an unchanged file reuses the cached image
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      powersync-storage:
        condition: service_healthy
    volumes:
      - ./powersync:/config:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      PS_DATA_SOURCE_URI: postgresql://powersync_role:${POWERSYNC_DB_PASSWORD}@${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:-5432}/${SUPABASE_DB_NAME:-postgres}
      PS_STORAGE_URI: postgresql://powersync_storage:${POWERSYNC_STORAGE_PASSWORD}@powersync-storage:5432/powersync_storage
      PS_SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?Set SUPABASE_JWT_SECRET to the JWT secret of the Supabase stack}
      PS_SYNC_CONFIG_PATH: ${PS_SYNC_CONFIG_PATH:-/sync/sync-config.yaml}
      NODE_OPTIONS: --max-old-space-size=1000
    # No published ports: public traffic comes through the Cloudflare Tunnel to Traefik, which routes to container port 8080 (HTTPS ends at Cloudflare).
    networks:
      - default
      - supabase
      - traefik

volumes:
  powersync-storage-data:
  # Only holds the lock file shared by `migrate` and `backup`.
  backup-lock:

networks:
  # Default network of the Supabase stack (in Dokploy: <supabase app name>_default).
  supabase:
    name: ${SUPABASE_NETWORK:?Set SUPABASE_NETWORK to the default network of the Supabase stack}
    external: true
  # Only for Traefik routing to powersync.
  traefik:
    name: ${DOKPLOY_NETWORK:-dokploy-network}
    external: true
