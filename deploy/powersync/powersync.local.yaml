# PowerSync Open Edition service config. Only PS_* variables can be substituted with !env.
# Reference: https://docs.powersync.com/self-hosting/installation/powersync-service-setup
telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable # internal Docker network

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable # internal Docker network

port: 8080

sync_config:
  path: !env PS_SYNC_CONFIG_PATH

# Local development only (docs/local-development.md). The local Supabase signs tokens with a key
# created for each stack, so PowerSync reads it from the stack's JWKS endpoint on the Docker network.
client_auth:
  jwks_uri: !env PS_JWKS_URI
  block_local_jwks: false
  audience: ["authenticated"]
