# Local development only: layered over compose.yaml to run PowerSync next to `supabase start`.
# Dokploy never reads this file. Usage: docs/local-development.md.

name: trailskill-local

services:
  # The Edge Functions are delivered into the Supabase stack's functions folder, which `supabase start` does not have:
  # they only run with the profile `dokploy-only`, which nobody turns on locally.
  functions:
    profiles: ["dokploy-only"]

  functions-ok:
    profiles: ["dokploy-only"]

  powersync-storage:
    restart: "no"

  # The daily backup needs the R2 settings and has nothing to back up locally: not started unless asked for.
  backup:
    profiles: ["backup"]

  powersync:
    # Stops with the machine instead of restart-looping once the local Supabase is down.
    restart: "no"
    ports:
      - "127.0.0.1:8080:8080"
    networks: !override
      - default
      - supabase
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.local.yaml
      PS_JWKS_URI: ${SUPABASE_JWKS_URI:?Set SUPABASE_JWKS_URI}
