# PowerSync Sync Streams. They mirror the select policies in supabase/migrations
# (athletes_visibility_and_policies, school-console_policies, accounts_policies,
# timing_measurements, athletes_managed_school_links,
# school-console_managed_policies, accounts_authorizations_invitations):
# a row syncs only if the signed-in user could read it through RLS.
# Platform admins have no stream on purpose: their access is online support.
config:
  edition: 3

with:
  managed_athlete_ids: SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id()
  coach_direct_athlete_ids: SELECT athlete_id FROM coach_athlete_assignments WHERE coach_user_id = auth.user_id()
  coach_group_athlete_ids: SELECT athlete_id FROM athlete_groups WHERE group_id IN (SELECT group_id FROM coach_group_assignments WHERE coach_user_id = auth.user_id())
  admin_school_ids: SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND role = 'school_admin'
  admin_athlete_ids: SELECT athlete_id FROM athlete_schools WHERE school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND role = 'school_admin')
  admin_group_ids: SELECT id FROM training_groups WHERE school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND role = 'school_admin')
  member_school_ids: SELECT school_id FROM school_memberships WHERE user_id = auth.user_id()
  managed_school_ids: SELECT school_id FROM athlete_schools WHERE athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())
  managed_category_ids: SELECT category_id FROM athlete_schools WHERE category_id IS NOT NULL AND athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())
  managed_group_ids: SELECT group_id FROM athlete_groups WHERE athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())
  own_series_ids: SELECT id FROM timing_series WHERE created_by = auth.user_id()

streams:
  athletes_visible:
    auto_subscribe: true
    queries:
      - SELECT * FROM athletes WHERE id IN managed_athlete_ids OR id IN coach_direct_athlete_ids OR id IN coach_group_athlete_ids OR id IN admin_athlete_ids
      - SELECT * FROM athlete_schools WHERE athlete_id IN managed_athlete_ids OR athlete_id IN coach_direct_athlete_ids OR athlete_id IN coach_group_athlete_ids OR athlete_id IN admin_athlete_ids
      - SELECT * FROM athlete_groups WHERE athlete_id IN managed_athlete_ids OR athlete_id IN coach_direct_athlete_ids OR athlete_id IN coach_group_athlete_ids OR athlete_id IN admin_athlete_ids

  accounts_athlete_managers:
    auto_subscribe: true
    queries:
      - SELECT * FROM athlete_managers WHERE athlete_id IN managed_athlete_ids OR athlete_id IN coach_direct_athlete_ids OR athlete_id IN coach_group_athlete_ids OR athlete_id IN admin_athlete_ids

  school_console_school:
    auto_subscribe: true
    queries:
      - SELECT * FROM schools WHERE id IN member_school_ids
      - SELECT * FROM categories WHERE school_id IN member_school_ids
      - SELECT * FROM training_groups WHERE school_id IN member_school_ids

  school_console_managed:
    auto_subscribe: true
    queries:
      - SELECT * FROM schools WHERE id IN managed_school_ids
      - SELECT * FROM categories WHERE id IN managed_category_ids
      - SELECT * FROM training_groups WHERE id IN managed_group_ids

  school_console_staff:
    auto_subscribe: true
    queries:
      - SELECT * FROM school_memberships WHERE user_id = auth.user_id() OR school_id IN admin_school_ids
      - SELECT * FROM coach_group_assignments WHERE coach_user_id = auth.user_id() OR group_id IN admin_group_ids
      - SELECT * FROM coach_athlete_assignments WHERE coach_user_id = auth.user_id() OR athlete_id IN admin_athlete_ids

  timing_series_own:
    auto_subscribe: true
    queries:
      - SELECT * FROM timing_series WHERE created_by = auth.user_id()

  timing_measurements:
    auto_subscribe: true
    queries:
      - SELECT * FROM measurements WHERE athlete_id IN managed_athlete_ids OR athlete_id IN coach_direct_athlete_ids OR athlete_id IN coach_group_athlete_ids OR athlete_id IN admin_athlete_ids
      - SELECT * FROM measurements WHERE athlete_id IS NULL AND series_id IN own_series_ids

  accounts_authorization_texts:
    auto_subscribe: true
    queries:
      - SELECT * FROM authorization_texts

  # Evidence syncs only to its author; school admins read it online.
  accounts_authorizations_own:
    auto_subscribe: true
    queries:
      - SELECT * FROM authorizations WHERE user_id = auth.user_id()

  accounts_authorization_status:
    auto_subscribe: true
    queries:
      - SELECT * FROM authorization_status WHERE athlete_id IN managed_athlete_ids OR athlete_id IN coach_direct_athlete_ids OR athlete_id IN coach_group_athlete_ids OR athlete_id IN admin_athlete_ids

  accounts_school_invitations:
    auto_subscribe: true
    queries:
      - SELECT * FROM school_invitations WHERE school_id IN admin_school_ids
