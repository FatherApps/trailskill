# PowerSync Sync Streams. They mirror the select policies in supabase/migrations
# (athletes_visibility_and_policies, school-console_policies, accounts_policies,
# timing_measurements, athletes_managed_school_links,
# school-console_managed_policies, accounts_authorizations_invitations,
# training-plans_plans, accounts_record_times_withdrawal_check,
# timing_hide_after_withdrawal, training-plans_assignments,
# training-plans_assignment_scope_and_withdrawal, timing_school_id,
# school-console_coach_assignment_school, timing_admin_measurement_conflicts,
# training-plans_notices, results-import_provenance,
# accounts_admin_reads_adult_profiles, family-timing_measurements,
# timing_guardian_school_times_sharing):
# a row syncs only if the signed-in user could read it through RLS.
# Platform admins have no stream on purpose: their access is online support.
config:
  edition: 3

with:
  managed_athlete_ids: SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id()
  self_athlete_ids: SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id() AND relation = 'self'
  coach_direct_athlete_ids: SELECT athlete_id FROM coach_athlete_assignments WHERE coach_user_id = auth.user_id() AND school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL)
  coach_group_athlete_ids: SELECT athlete_id FROM athlete_groups WHERE group_id IN (SELECT group_id FROM coach_group_assignments WHERE coach_user_id = auth.user_id() AND group_id IN (SELECT id FROM training_groups WHERE school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL)))
  admin_school_ids: SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND role = 'school_admin'
  admin_athlete_ids: SELECT athlete_id FROM athlete_schools WHERE school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND role = 'school_admin')
  admin_group_ids: SELECT id FROM training_groups WHERE school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND role = 'school_admin')
  # A deactivated coach membership gives no access (#1031); the coach's own membership row still syncs
  # (school_console_staff), so the app can show that the account is deactivated.
  member_school_ids: SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL
  member_group_ids: SELECT id FROM training_groups WHERE school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL)
  managed_school_ids: SELECT school_id FROM athlete_schools WHERE athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())
  managed_category_ids: SELECT category_id FROM athlete_schools WHERE category_id IS NOT NULL AND athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())
  managed_group_ids: SELECT group_id FROM athlete_groups WHERE athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())
  own_series_ids: SELECT id FROM timing_series WHERE created_by = auth.user_id() AND school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL)
  coach_group_ids: SELECT group_id FROM coach_group_assignments WHERE coach_user_id = auth.user_id() AND group_id IN (SELECT id FROM training_groups WHERE school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL))
  coach_direct_group_ids: SELECT group_id FROM athlete_groups WHERE group_id IN (SELECT id FROM training_groups WHERE school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL)) AND athlete_id IN (SELECT athlete_id FROM coach_athlete_assignments WHERE coach_user_id = auth.user_id() AND school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL))
  coach_direct_category_ids: SELECT category_id FROM athlete_schools WHERE category_id IS NOT NULL AND school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL) AND athlete_id IN (SELECT athlete_id FROM coach_athlete_assignments WHERE coach_user_id = auth.user_id() AND school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL))
  coach_group_category_ids: SELECT category_id FROM athlete_schools WHERE category_id IS NOT NULL AND school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL) AND athlete_id IN (SELECT athlete_id FROM athlete_groups WHERE group_id IN (SELECT group_id FROM coach_group_assignments WHERE coach_user_id = auth.user_id() AND group_id IN (SELECT id FROM training_groups WHERE school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL))))
  managed_assignment_ids: SELECT id FROM training_plan_assignments WHERE withdrawn_at IS NULL AND (athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id()) OR group_id IN (SELECT group_id FROM athlete_groups WHERE athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())) OR category_id IN (SELECT category_id FROM athlete_schools WHERE category_id IS NOT NULL AND athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())) OR (target = 'school' AND school_id IN (SELECT school_id FROM athlete_schools WHERE athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id()))))
  import_authorized_athlete_ids: SELECT athlete_id FROM authorization_status WHERE purpose = 'import_official_results' AND is_granted = true AND athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())
  admin_guardian_user_ids: SELECT user_id FROM athlete_managers WHERE relation = 'guardian' AND athlete_id IN (SELECT athlete_id FROM athlete_schools WHERE school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND role = 'school_admin'))
  admin_coach_user_ids: SELECT user_id FROM school_memberships WHERE role = 'coach' AND school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND role = 'school_admin')

streams:
  athletes_visible:
    auto_subscribe: true
    queries:
      - SELECT * FROM athletes WHERE id IN managed_athlete_ids OR id IN coach_direct_athlete_ids OR id IN coach_group_athlete_ids OR id IN admin_athlete_ids
      # A coach gets the school and group rows of an athlete only for the schools where the coach is active
      # (athlete_schools_select, athlete_groups_select); one query per source, so each stays a plain AND.
      - SELECT * FROM athlete_schools WHERE athlete_id IN managed_athlete_ids OR athlete_id IN admin_athlete_ids
      - SELECT * FROM athlete_schools WHERE athlete_id IN coach_direct_athlete_ids AND school_id IN member_school_ids
      - SELECT * FROM athlete_schools WHERE athlete_id IN coach_group_athlete_ids AND school_id IN member_school_ids
      - SELECT * FROM athlete_groups WHERE athlete_id IN managed_athlete_ids OR athlete_id IN admin_athlete_ids
      - SELECT * FROM athlete_groups WHERE athlete_id IN coach_direct_athlete_ids AND group_id IN member_group_ids
      - SELECT * FROM athlete_groups WHERE athlete_id IN coach_group_athlete_ids AND group_id IN member_group_ids

  accounts_athlete_managers:
    auto_subscribe: true
    queries:
      - SELECT * FROM athlete_managers WHERE athlete_id IN managed_athlete_ids OR athlete_id IN coach_direct_athlete_ids OR athlete_id IN coach_group_athlete_ids OR athlete_id IN admin_athlete_ids

  # School admins read the name and the contact (the account email) of the guardians of
  # their school's athletes and of their school's coaches, nothing else about them
  # (issue #220). Adult athletes (relation 'self') are not included. Everyone's own
  # profile is not synced: the app reads and writes it online.
  accounts_adult_profiles:
    auto_subscribe: true
    queries:
      - SELECT user_id AS id, first_name, last_name, contact_email FROM adult_profiles WHERE user_id IN admin_guardian_user_ids OR user_id IN admin_coach_user_ids

  school_console_school:
    auto_subscribe: true
    queries:
      - SELECT * FROM schools WHERE id IN member_school_ids
      - SELECT * FROM categories WHERE school_id IN member_school_ids
      - SELECT * FROM training_groups WHERE school_id IN member_school_ids

  school_console_managed:
    auto_subscribe: true
    queries:
      - SELECT * FROM schools WHERE id IN managed_school_ids
      - SELECT * FROM categories WHERE id IN managed_category_ids
      - SELECT * FROM training_groups WHERE id IN managed_group_ids

  school_console_staff:
    auto_subscribe: true
    queries:
      - SELECT * FROM school_memberships WHERE user_id = auth.user_id() OR school_id IN admin_school_ids
      - SELECT * FROM coach_group_assignments WHERE coach_user_id = auth.user_id() AND group_id IN coach_group_ids
      - SELECT * FROM coach_group_assignments WHERE group_id IN admin_group_ids
      - SELECT * FROM coach_athlete_assignments WHERE coach_user_id = auth.user_id() AND school_id IN member_school_ids
      - SELECT * FROM coach_athlete_assignments WHERE school_id IN admin_school_ids

  timing_series_own:
    auto_subscribe: true
    queries:
      - SELECT * FROM timing_series WHERE created_by = auth.user_id() AND school_id IN member_school_ids

  timing_measurements:
    auto_subscribe: true
    queries:
      # The guardian branches of measurements_select (#1018): a guardian gets the school times the school shares and
      # the rows hidden after a withdrawal; an adult athlete gets all their own. Everyone else does not get hidden rows.
      # Every column except the staff authors created_by, edited_by and discarded_by (#1020). Keep the others: a row the
      # user also reads as staff is stored once on the device, from whichever query sent it last.
      - SELECT id, created_at, device_id, kind, athlete_id, series_id, arrival_position, hundredths, stroke, distance, pool, session_type, source, captured_at, parent_id, discarded_at, version, base_version, edited_device_id, edited_at, edit_reason, hidden, school_id, guardian_visible FROM measurements WHERE athlete_id IN managed_athlete_ids AND guardian_visible = true
      - SELECT id, created_at, device_id, kind, athlete_id, series_id, arrival_position, hundredths, stroke, distance, pool, session_type, source, captured_at, parent_id, discarded_at, version, base_version, edited_device_id, edited_at, edit_reason, hidden, school_id, guardian_visible FROM measurements WHERE athlete_id IN managed_athlete_ids AND hidden = true
      - SELECT id, created_at, device_id, kind, athlete_id, series_id, arrival_position, hundredths, stroke, distance, pool, session_type, source, captured_at, parent_id, discarded_at, version, base_version, edited_device_id, edited_at, edit_reason, hidden, school_id, guardian_visible FROM measurements WHERE athlete_id IN self_athlete_ids
      # One query per source, so each stays a plain AND of conditions. Staff get
      # only the marks of their own schools (issue #291); other schools read online (#68).
      - SELECT * FROM measurements WHERE athlete_id IN coach_direct_athlete_ids AND hidden = false AND school_id IN member_school_ids
      - SELECT * FROM measurements WHERE athlete_id IN coach_group_athlete_ids AND hidden = false AND school_id IN member_school_ids
      - SELECT * FROM measurements WHERE athlete_id IN admin_athlete_ids AND hidden = false AND school_id IN member_school_ids
      - SELECT * FROM measurements WHERE athlete_id IS NULL AND series_id IN own_series_ids

  training_plans_school:
    auto_subscribe: true
    queries:
      - SELECT * FROM training_plans WHERE school_id IN member_school_ids
      - SELECT * FROM training_plan_versions WHERE plan_id IN (SELECT id FROM training_plans WHERE school_id IN member_school_ids)
      - SELECT * FROM training_plan_blocks WHERE version_id IN (SELECT id FROM training_plan_versions WHERE plan_id IN (SELECT id FROM training_plans WHERE school_id IN member_school_ids))

  # Staff download the assignments that concern them, always within their own schools
  # (a coach also gets the group assignments of the groups of their directly assigned athletes)
  # (a subset of the select policy, which lets any member read the whole school).
  # One query per source, so each stays a plain AND of one condition. A withdrawn
  # assignment syncs to nobody (issue #274); staff still read it online.
  training_plans_assignments_staff:
    auto_subscribe: true
    queries:
      - SELECT * FROM training_plan_assignments WHERE school_id IN admin_school_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE group_id IN coach_group_ids AND school_id IN member_school_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE group_id IN coach_direct_group_ids AND school_id IN member_school_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE athlete_id IN coach_direct_athlete_ids AND school_id IN member_school_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE athlete_id IN coach_group_athlete_ids AND school_id IN member_school_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE category_id IN coach_direct_category_ids AND school_id IN member_school_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE category_id IN coach_group_category_ids AND school_id IN member_school_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE target = 'school' AND school_id IN member_school_ids AND withdrawn_at IS NULL

  # Guardians and adult athletes: the assignments of their athletes, their groups,
  # their categories and school-wide ones, plus the assigned plan, the assigned
  # version only and its blocks. Same conditions as the select policies.
  training_plans_assignments_managed:
    auto_subscribe: true
    queries:
      - SELECT * FROM training_plan_assignments WHERE athlete_id IN managed_athlete_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE group_id IN managed_group_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE category_id IN managed_category_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE target = 'school' AND school_id IN managed_school_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plans WHERE id IN (SELECT plan_id FROM training_plan_assignments WHERE id IN managed_assignment_ids)
      - SELECT * FROM training_plan_versions WHERE id IN (SELECT version_id FROM training_plan_assignments WHERE id IN managed_assignment_ids)
      - SELECT * FROM training_plan_blocks WHERE version_id IN (SELECT version_id FROM training_plan_assignments WHERE id IN managed_assignment_ids)

  training_plans_fulfillments:
    auto_subscribe: true
    queries:
      # Guardians and adult athletes also get the marks hidden after a withdrawal; everyone else does not.
      - SELECT * FROM training_plan_fulfillments WHERE athlete_id IN managed_athlete_ids
      - SELECT * FROM training_plan_fulfillments WHERE athlete_id IN coach_direct_athlete_ids AND hidden = false AND assignment_id IN (SELECT id FROM training_plan_assignments WHERE school_id IN member_school_ids)
      - SELECT * FROM training_plan_fulfillments WHERE athlete_id IN coach_group_athlete_ids AND hidden = false AND assignment_id IN (SELECT id FROM training_plan_assignments WHERE school_id IN member_school_ids)
      - SELECT * FROM training_plan_fulfillments WHERE athlete_id IN admin_athlete_ids AND hidden = false

  # Notes of guardians and adult athletes on a session. Only the people who manage
  # the athlete get them; coaches have no stream for them yet. The body is free text: never log it.
  training_plans_notices:
    auto_subscribe: true
    queries:
      - SELECT * FROM training_plan_notices WHERE athlete_id IN managed_athlete_ids

  # Authors see their conflicts (as the stored version's author or the one whose
  # edit was not applied); the generic record_conflicts table is how the device
  # flags the record. School admins also get the status of the conflicts of their
  # school's measurements they can read, never the values (issue #316). Platform
  # admins read the rest online.
  timing_measurement_conflicts:
    auto_subscribe: true
    queries:
      - SELECT id, 'measurements' AS table_name, measurement_id AS record_id, status FROM measurement_conflicts AS record_conflicts WHERE incoming_by = auth.user_id()
      - SELECT id, 'measurements' AS table_name, measurement_id AS record_id, status FROM measurement_conflicts AS record_conflicts WHERE current_by = auth.user_id()
      - SELECT id, 'measurements' AS table_name, measurement_id AS record_id, status FROM measurement_conflicts AS record_conflicts WHERE measurement_id IN (SELECT id FROM measurements WHERE school_id IN admin_school_ids AND athlete_id IN admin_athlete_ids AND hidden = false)

  accounts_authorization_texts:
    auto_subscribe: true
    queries:
      - SELECT * FROM authorization_texts

  # Evidence syncs only to its author; school admins read it online.
  accounts_authorizations_own:
    auto_subscribe: true
    queries:
      - SELECT * FROM authorizations WHERE user_id = auth.user_id()

  accounts_authorization_status:
    auto_subscribe: true
    queries:
      - SELECT * FROM authorization_status WHERE athlete_id IN managed_athlete_ids OR athlete_id IN coach_direct_athlete_ids OR athlete_id IN coach_group_athlete_ids OR athlete_id IN admin_athlete_ids

  accounts_school_invitations:
    auto_subscribe: true
    queries:
      - SELECT * FROM school_invitations WHERE school_id IN admin_school_ids

  # Imported official results, their provenance and the pending differences, only for
  # guardians and adult athletes of an athlete with the import authorization in force
  # (same condition as the select policies). Nobody else gets them; they hold no
  # identity data (no document, no birth date, no key of the athlete at the source).
  results_import_imported:
    auto_subscribe: true
    queries:
      - SELECT * FROM results_imports WHERE athlete_id IN import_authorized_athlete_ids
      - SELECT * FROM imported_results WHERE athlete_id IN import_authorized_athlete_ids
      - SELECT * FROM imported_result_changes WHERE athlete_id IN import_authorized_athlete_ids

  # "Mis tiempos": the times a guardian or adult athlete measured themselves, only for their owner
  # (family_timing_measurements_select). Deleted ones come too, so "Eliminados" can restore them for 30 days.
  family_timing_measurements:
    auto_subscribe: true
    queries:
      - SELECT * FROM family_timing_measurements WHERE owner_user_id = auth.user_id()

  # A time sent to another swimmer's family (#973): the swimmer's family reads the request, the sender only until it
  # is accepted (#1014); an accepted one leaves the sender's device (family_timing_transfers_select).
  family_timing_transfers:
    auto_subscribe: true
    queries:
      - SELECT * FROM family_timing_transfers WHERE (from_user_id = auth.user_id() AND status <> 'accepted') OR athlete_id IN managed_athlete_ids
