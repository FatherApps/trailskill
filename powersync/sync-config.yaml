# PowerSync Sync Streams. They mirror the select policies in supabase/migrations
# (athletes_visibility_and_policies, school-console_policies, accounts_policies,
# timing_measurements, athletes_managed_school_links,
# school-console_managed_policies, accounts_authorizations_invitations,
# training-plans_plans, accounts_record_times_withdrawal_check,
# timing_hide_after_withdrawal, training-plans_assignments,
# training-plans_assignment_scope_and_withdrawal, timing_school_id,
# school-console_coach_assignment_school, timing_admin_measurement_conflicts,
# training-plans_notices, results-import_provenance,
# accounts_admin_reads_adult_profiles, family-timing_measurements,
# timing_guardian_school_times_sharing, timing_coach_reads_assignment_school,
# training-plans_coach_reads_fulfillments_assignment_school,
# training-plans_admin_reads_fulfillments_assignment_school,
# athletes_coach_reads_enrollment_school, athletes_admin_reads_enrollment_school,
# athletes_photos, athletes_birth_date_and_gender, athletes_athlete_schools_end, accounts_saved_share_codes, accounts_saved_share_codes_expired, results-import_tournaments):
# a row syncs only if the signed-in user could read it through RLS.
# An ended link (athlete_schools.ended_at, #1243) gives its school's coaches and admins nothing of that swimmer, one
# (swimmer, school) pair at a time. Every staff query keeps ended_at IS NULL on athlete_schools. PowerSync 1.21 builds the
# buckets of a join from separate lookups and combines their values as a cross product, so the pair survives only in three
# shapes (#1260, checked against a real PowerSync with an admin and a coach of two schools):
#   admin          school_memberships joined to the row by its school first, athlete_schools last by that same school
#   direct coach   the admin shape, then coach_athlete_assignments last as a filter on the same pair
#   coach by group the chain starts at training_groups.id IN coach_group_ids and ends at athlete_schools
# A school condition of its own (IN member_school_ids, an extra join on school_memberships) beside the admin or by-group
# joins splits the swimmer from the school again and brings the ended pair back: change a query only with a real PowerSync.
# Guardians and adult athletes (managed_athlete_ids) keep everything, the ended row included.
# Platform admins have no stream on purpose: their access is online support.
# A user marked for deletion (#1244, 30-day grace period) syncs nothing. Sync Streams cannot say NOT IN (subquery), so every query
# and every WITH set bound to the user (it contains auth.user_id()) ends with a gate that needs the user's row in
# account_sync_access, which exists for every user that is not marked (supabase/migrations/20261120120400_accounts_sync_access.sql).
# The gate is one condition of its own at the end of the top-level WHERE, never inside a join or a subquery: PowerSync 1.21 builds
# the buckets of a join from separate lookups, and a condition added inside would change how they combine (the staff streams of
# #1260 would leak the ended pair again). Keep it that way; powersync/scripts/verify-ended-link-streams.mjs checks it against a real
# PowerSync and accountDeletionSyncStreams.test.ts keeps every query gated.
config:
  edition: 3

with:
  managed_athlete_ids: SELECT athlete_id FROM athlete_managers WHERE (user_id = auth.user_id()) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  self_athlete_ids: SELECT athlete_id FROM athlete_managers WHERE (user_id = auth.user_id() AND relation = 'self') AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  coach_direct_athlete_ids: SELECT athlete_schools.athlete_id FROM athlete_schools JOIN coach_athlete_assignments ON athlete_schools.athlete_id = coach_athlete_assignments.athlete_id AND athlete_schools.school_id = coach_athlete_assignments.school_id WHERE (coach_athlete_assignments.coach_user_id = auth.user_id() AND athlete_schools.ended_at IS NULL AND coach_athlete_assignments.school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL)) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  coach_group_athlete_ids: SELECT athlete_schools.athlete_id FROM athlete_schools JOIN training_groups ON athlete_schools.school_id = training_groups.school_id JOIN athlete_groups ON athlete_schools.athlete_id = athlete_groups.athlete_id AND training_groups.id = athlete_groups.group_id JOIN coach_group_assignments ON training_groups.id = coach_group_assignments.group_id WHERE (coach_group_assignments.coach_user_id = auth.user_id() AND athlete_schools.ended_at IS NULL AND athlete_schools.school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL)) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  admin_school_ids: SELECT school_id FROM school_memberships WHERE (user_id = auth.user_id() AND role = 'school_admin') AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  admin_athlete_ids: SELECT athlete_id FROM athlete_schools WHERE (ended_at IS NULL AND school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND role = 'school_admin')) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  admin_group_ids: SELECT id FROM training_groups WHERE (school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND role = 'school_admin')) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  # A deactivated coach membership gives no access (#1031); the coach's own membership row still syncs
  # (school_console_staff), so the app can show that the account is deactivated.
  member_school_ids: SELECT school_id FROM school_memberships WHERE (user_id = auth.user_id() AND deactivated_at IS NULL) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  member_group_ids: SELECT id FROM training_groups WHERE (school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL)) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  managed_school_ids: SELECT school_id FROM athlete_schools WHERE (athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  managed_category_ids: SELECT category_id FROM athlete_schools WHERE (category_id IS NOT NULL AND athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  managed_group_ids: SELECT group_id FROM athlete_groups WHERE (athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  own_series_ids: SELECT id FROM timing_series WHERE (created_by = auth.user_id() AND school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL)) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  coach_group_ids: SELECT group_id FROM coach_group_assignments WHERE (coach_user_id = auth.user_id() AND group_id IN (SELECT id FROM training_groups WHERE school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL))) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  coach_direct_group_ids: SELECT group_id FROM athlete_groups WHERE (group_id IN (SELECT id FROM training_groups WHERE school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL)) AND athlete_id IN (SELECT athlete_id FROM coach_athlete_assignments WHERE coach_user_id = auth.user_id() AND school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL))) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  managed_assignment_ids: SELECT id FROM training_plan_assignments WHERE (withdrawn_at IS NULL AND (athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id()) OR group_id IN (SELECT group_id FROM athlete_groups WHERE athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())) OR category_id IN (SELECT category_id FROM athlete_schools WHERE category_id IS NOT NULL AND athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())) OR (target = 'school' AND school_id IN (SELECT school_id FROM athlete_schools WHERE athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id()))))) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  import_authorized_athlete_ids: SELECT athlete_id FROM authorization_status WHERE (purpose = 'import_official_results' AND is_granted = true AND athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  # Athlete photos (#1221): the athletes the user can already see (the four sources of athletes_visible) whose show_photo is in
  # force. One set per source, because a bucket parameter must come from a single subquery bound to the user: the join with
  # authorization_status lives inside each one, so the photo row leaves the device when show_photo is withdrawn.
  photo_managed_athlete_ids: SELECT athlete_id FROM authorization_status WHERE (purpose = 'show_photo' AND is_granted = true AND athlete_id IN (SELECT athlete_id FROM athlete_managers WHERE user_id = auth.user_id())) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  photo_coach_direct_athlete_ids: SELECT athlete_id FROM authorization_status WHERE (purpose = 'show_photo' AND is_granted = true AND athlete_id IN (SELECT athlete_schools.athlete_id FROM athlete_schools JOIN coach_athlete_assignments ON athlete_schools.athlete_id = coach_athlete_assignments.athlete_id AND athlete_schools.school_id = coach_athlete_assignments.school_id WHERE coach_athlete_assignments.coach_user_id = auth.user_id() AND athlete_schools.ended_at IS NULL AND coach_athlete_assignments.school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL))) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  photo_coach_group_athlete_ids: SELECT athlete_id FROM authorization_status WHERE (purpose = 'show_photo' AND is_granted = true AND athlete_id IN (SELECT athlete_schools.athlete_id FROM athlete_schools JOIN training_groups ON athlete_schools.school_id = training_groups.school_id JOIN athlete_groups ON athlete_schools.athlete_id = athlete_groups.athlete_id AND training_groups.id = athlete_groups.group_id JOIN coach_group_assignments ON training_groups.id = coach_group_assignments.group_id WHERE coach_group_assignments.coach_user_id = auth.user_id() AND athlete_schools.ended_at IS NULL AND athlete_schools.school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND deactivated_at IS NULL))) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  photo_admin_athlete_ids: SELECT athlete_id FROM authorization_status WHERE (purpose = 'show_photo' AND is_granted = true AND athlete_id IN (SELECT athlete_id FROM athlete_schools WHERE ended_at IS NULL AND school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND role = 'school_admin'))) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  admin_guardian_user_ids: SELECT user_id FROM athlete_managers WHERE (relation = 'guardian' AND athlete_id IN (SELECT athlete_id FROM athlete_schools WHERE ended_at IS NULL AND school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND role = 'school_admin'))) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
  admin_coach_user_ids: SELECT user_id FROM school_memberships WHERE (role = 'coach' AND school_id IN (SELECT school_id FROM school_memberships WHERE user_id = auth.user_id() AND role = 'school_admin')) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())

streams:
  athletes_visible:
    auto_subscribe: true
    queries:
      - SELECT * FROM athletes WHERE id IN managed_athlete_ids OR id IN coach_direct_athlete_ids OR id IN coach_group_athlete_ids OR id IN admin_athlete_ids
      # A coach gets an enrollment or group row of an athlete only for a school where that swimmer is assigned to them,
      # directly or through a group of that school (#1132; athlete_schools_select, athlete_groups_select): the joins bind
      # swimmer and school as training_plans_fulfillments does. An admin gets them only for the schools they administer
      # (#1150): the enrollment row is itself the (swimmer, school) pair, and a group row joins the enrollment of its
      # school. One query per source, so each stays a plain AND. admin_athlete_ids stays school-free by design for the
      # athletes, athlete_managers and authorization_status rows: they have no school column.
      - SELECT * FROM athlete_schools WHERE athlete_id IN managed_athlete_ids
      - SELECT * FROM athlete_schools WHERE school_id IN admin_school_ids AND ended_at IS NULL
      - SELECT athlete_schools.* FROM athlete_schools JOIN coach_athlete_assignments ON athlete_schools.athlete_id = coach_athlete_assignments.athlete_id AND athlete_schools.school_id = coach_athlete_assignments.school_id WHERE (coach_athlete_assignments.coach_user_id = auth.user_id() AND athlete_schools.ended_at IS NULL AND athlete_schools.school_id IN member_school_ids) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
      - SELECT athlete_schools.* FROM athlete_schools JOIN athlete_groups ON athlete_schools.athlete_id = athlete_groups.athlete_id JOIN training_groups ON athlete_groups.group_id = training_groups.id AND athlete_schools.school_id = training_groups.school_id WHERE athlete_groups.group_id IN coach_group_ids AND athlete_schools.ended_at IS NULL AND athlete_schools.school_id IN member_school_ids
      - SELECT * FROM athlete_groups WHERE athlete_id IN managed_athlete_ids
      - SELECT athlete_groups.* FROM athlete_groups JOIN training_groups ON athlete_groups.group_id = training_groups.id JOIN school_memberships ON training_groups.school_id = school_memberships.school_id JOIN athlete_schools ON athlete_groups.athlete_id = athlete_schools.athlete_id AND school_memberships.school_id = athlete_schools.school_id WHERE (school_memberships.user_id = auth.user_id() AND school_memberships.role = 'school_admin' AND athlete_schools.ended_at IS NULL) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
      - SELECT athlete_groups.* FROM athlete_groups JOIN training_groups ON athlete_groups.group_id = training_groups.id JOIN school_memberships ON training_groups.school_id = school_memberships.school_id JOIN athlete_schools ON athlete_groups.athlete_id = athlete_schools.athlete_id AND school_memberships.school_id = athlete_schools.school_id JOIN coach_athlete_assignments ON athlete_schools.athlete_id = coach_athlete_assignments.athlete_id AND athlete_schools.school_id = coach_athlete_assignments.school_id WHERE (school_memberships.user_id = auth.user_id() AND school_memberships.deactivated_at IS NULL AND athlete_schools.ended_at IS NULL AND coach_athlete_assignments.coach_user_id = auth.user_id()) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
      - SELECT athlete_groups.* FROM athlete_groups JOIN training_groups ON athlete_groups.group_id = training_groups.id JOIN training_groups AS coached_groups ON training_groups.school_id = coached_groups.school_id JOIN athlete_groups AS coached ON athlete_groups.athlete_id = coached.athlete_id AND coached_groups.id = coached.group_id JOIN athlete_schools ON coached.athlete_id = athlete_schools.athlete_id AND coached_groups.school_id = athlete_schools.school_id WHERE coached_groups.id IN coach_group_ids AND athlete_schools.ended_at IS NULL

  accounts_athlete_managers:
    auto_subscribe: true
    queries:
      - SELECT * FROM athlete_managers WHERE athlete_id IN managed_athlete_ids OR athlete_id IN coach_direct_athlete_ids OR athlete_id IN coach_group_athlete_ids OR athlete_id IN admin_athlete_ids

  # School admins read the name and the contact (the account email) of the guardians of
  # their school's athletes and of their school's coaches, nothing else about them
  # (issue #220). Adult athletes (relation 'self') are not included. Everyone's own
  # profile is not synced: the app reads and writes it online.
  accounts_adult_profiles:
    auto_subscribe: true
    queries:
      - SELECT user_id AS id, first_name, last_name, contact_email FROM adult_profiles WHERE user_id IN admin_guardian_user_ids OR user_id IN admin_coach_user_ids

  # The share codes another family gave this user, kept after an accepted send (saved_athlete_share_codes_select, #1302). The swimmer
  # behind a code is not synced: the user has only the code and the short name, as when they typed it.
  # A code the family changed is kept with expired_at set (#1320). This stream, the one builds before #1320 know, gives only the
  # current codes, so those builds behave as before: a row that expires leaves this stream and goes from their phone.
  accounts_saved_share_codes:
    auto_subscribe: true
    queries:
      - SELECT id, user_id, code, athlete_short_name, saved_at FROM saved_athlete_share_codes WHERE (user_id = auth.user_id() AND expired_at IS NULL) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())

  # The expired codes of this user, with when they expired, for builds that know expired_at (#1320). Same rows, same table, never both streams.
  # It is auto-subscribed, and every client takes the auto-subscribed streams, so it also needs the connection parameter
  # expired_saved_share_codes (a connectOptions.params entry). No build sends it yet: the screen that shows expired codes (#1321) turns it
  # on in the same build, so until then nobody receives an expired row and every build behaves as before.
  accounts_saved_share_codes_expired:
    auto_subscribe: true
    queries:
      - SELECT id, user_id, code, athlete_short_name, saved_at, expired_at FROM saved_athlete_share_codes WHERE (user_id = auth.user_id() AND expired_at IS NOT NULL AND connection.parameter('expired_saved_share_codes') = 1) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())

  school_console_school:
    auto_subscribe: true
    queries:
      - SELECT * FROM schools WHERE id IN member_school_ids
      - SELECT * FROM categories WHERE school_id IN member_school_ids
      - SELECT * FROM training_groups WHERE school_id IN member_school_ids

  school_console_managed:
    auto_subscribe: true
    queries:
      - SELECT * FROM schools WHERE id IN managed_school_ids
      - SELECT * FROM categories WHERE id IN managed_category_ids
      - SELECT * FROM training_groups WHERE id IN managed_group_ids

  school_console_staff:
    auto_subscribe: true
    queries:
      - SELECT * FROM school_memberships WHERE (user_id = auth.user_id() OR school_id IN admin_school_ids) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
      - SELECT * FROM coach_group_assignments WHERE (coach_user_id = auth.user_id() AND group_id IN coach_group_ids) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
      - SELECT * FROM coach_group_assignments WHERE group_id IN admin_group_ids
      - SELECT coach_athlete_assignments.* FROM coach_athlete_assignments JOIN school_memberships ON coach_athlete_assignments.school_id = school_memberships.school_id JOIN athlete_schools ON coach_athlete_assignments.athlete_id = athlete_schools.athlete_id AND school_memberships.school_id = athlete_schools.school_id WHERE (school_memberships.user_id = auth.user_id() AND school_memberships.deactivated_at IS NULL AND athlete_schools.ended_at IS NULL AND coach_athlete_assignments.coach_user_id = auth.user_id()) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
      - SELECT coach_athlete_assignments.* FROM coach_athlete_assignments JOIN school_memberships ON coach_athlete_assignments.school_id = school_memberships.school_id JOIN athlete_schools ON coach_athlete_assignments.athlete_id = athlete_schools.athlete_id AND school_memberships.school_id = athlete_schools.school_id WHERE (school_memberships.user_id = auth.user_id() AND school_memberships.role = 'school_admin' AND athlete_schools.ended_at IS NULL) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())

  timing_series_own:
    auto_subscribe: true
    queries:
      - SELECT * FROM timing_series WHERE (created_by = auth.user_id() AND school_id IN member_school_ids) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())

  timing_measurements:
    auto_subscribe: true
    queries:
      # The guardian branches of measurements_select (#1018): a guardian gets the school times the school shares and
      # the rows hidden after a withdrawal; an adult athlete gets all their own. Everyone else does not get hidden rows.
      # Every column except the staff authors created_by, edited_by and discarded_by (#1020). Keep the others: a row the
      # user also reads as staff is stored once on the device, from whichever query sent it last.
      - SELECT id, created_at, device_id, kind, athlete_id, series_id, arrival_position, hundredths, stroke, distance, pool, session_type, source, captured_at, parent_id, discarded_at, version, base_version, edited_device_id, edited_at, edit_reason, hidden, school_id, guardian_visible FROM measurements WHERE athlete_id IN managed_athlete_ids AND guardian_visible = true
      - SELECT id, created_at, device_id, kind, athlete_id, series_id, arrival_position, hundredths, stroke, distance, pool, session_type, source, captured_at, parent_id, discarded_at, version, base_version, edited_device_id, edited_at, edit_reason, hidden, school_id, guardian_visible FROM measurements WHERE athlete_id IN managed_athlete_ids AND hidden = true
      - SELECT id, created_at, device_id, kind, athlete_id, series_id, arrival_position, hundredths, stroke, distance, pool, session_type, source, captured_at, parent_id, discarded_at, version, base_version, edited_device_id, edited_at, edit_reason, hidden, school_id, guardian_visible FROM measurements WHERE athlete_id IN self_athlete_ids
      # One query per source, so each stays a plain AND of conditions. Staff get
      # only the marks of their own schools (issue #291); other schools read online (#68).
      # A coach gets a mark only for a swimmer assigned in the mark's school, directly or through a group of that
      # school (#1122), so the join binds swimmer and school; an admin only for their admin schools.
      - SELECT measurements.* FROM measurements JOIN school_memberships ON measurements.school_id = school_memberships.school_id JOIN athlete_schools ON measurements.athlete_id = athlete_schools.athlete_id AND school_memberships.school_id = athlete_schools.school_id JOIN coach_athlete_assignments ON athlete_schools.athlete_id = coach_athlete_assignments.athlete_id AND athlete_schools.school_id = coach_athlete_assignments.school_id WHERE (school_memberships.user_id = auth.user_id() AND school_memberships.deactivated_at IS NULL AND athlete_schools.ended_at IS NULL AND coach_athlete_assignments.coach_user_id = auth.user_id() AND measurements.hidden = false) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
      - SELECT measurements.* FROM measurements JOIN training_groups ON measurements.school_id = training_groups.school_id JOIN athlete_groups ON measurements.athlete_id = athlete_groups.athlete_id AND training_groups.id = athlete_groups.group_id JOIN athlete_schools ON athlete_groups.athlete_id = athlete_schools.athlete_id AND training_groups.school_id = athlete_schools.school_id WHERE training_groups.id IN coach_group_ids AND athlete_schools.ended_at IS NULL AND measurements.hidden = false
      - SELECT measurements.* FROM measurements JOIN school_memberships ON measurements.school_id = school_memberships.school_id JOIN athlete_schools ON measurements.athlete_id = athlete_schools.athlete_id AND school_memberships.school_id = athlete_schools.school_id WHERE (school_memberships.user_id = auth.user_id() AND school_memberships.role = 'school_admin' AND athlete_schools.ended_at IS NULL AND measurements.hidden = false) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
      - SELECT * FROM measurements WHERE athlete_id IS NULL AND series_id IN own_series_ids

  training_plans_school:
    auto_subscribe: true
    queries:
      - SELECT * FROM training_plans WHERE school_id IN member_school_ids
      - SELECT * FROM training_plan_versions WHERE plan_id IN (SELECT id FROM training_plans WHERE school_id IN member_school_ids)
      - SELECT * FROM training_plan_blocks WHERE version_id IN (SELECT id FROM training_plan_versions WHERE plan_id IN (SELECT id FROM training_plans WHERE school_id IN member_school_ids))

  # Staff download the assignments that concern them, always within their own schools
  # (a coach also gets the group assignments of the groups of their directly assigned athletes)
  # (a subset of the select policy, which lets any member read the whole school).
  # One query per source, so each stays a plain AND of one condition. A withdrawn
  # assignment syncs to nobody (issue #274); staff still read it online.
  training_plans_assignments_staff:
    auto_subscribe: true
    queries:
      - SELECT * FROM training_plan_assignments WHERE school_id IN admin_school_ids AND target <> 'athlete' AND withdrawn_at IS NULL
      - SELECT training_plan_assignments.* FROM training_plan_assignments JOIN school_memberships ON training_plan_assignments.school_id = school_memberships.school_id JOIN athlete_schools ON training_plan_assignments.athlete_id = athlete_schools.athlete_id AND school_memberships.school_id = athlete_schools.school_id WHERE (school_memberships.user_id = auth.user_id() AND school_memberships.role = 'school_admin' AND athlete_schools.ended_at IS NULL AND training_plan_assignments.withdrawn_at IS NULL) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
      - SELECT * FROM training_plan_assignments WHERE group_id IN coach_group_ids AND school_id IN member_school_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE group_id IN coach_direct_group_ids AND school_id IN member_school_ids AND withdrawn_at IS NULL
      - SELECT training_plan_assignments.* FROM training_plan_assignments JOIN school_memberships ON training_plan_assignments.school_id = school_memberships.school_id JOIN athlete_schools ON training_plan_assignments.athlete_id = athlete_schools.athlete_id AND school_memberships.school_id = athlete_schools.school_id JOIN coach_athlete_assignments ON athlete_schools.athlete_id = coach_athlete_assignments.athlete_id AND athlete_schools.school_id = coach_athlete_assignments.school_id WHERE (school_memberships.user_id = auth.user_id() AND school_memberships.deactivated_at IS NULL AND athlete_schools.ended_at IS NULL AND coach_athlete_assignments.coach_user_id = auth.user_id() AND training_plan_assignments.withdrawn_at IS NULL) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
      - SELECT training_plan_assignments.* FROM training_plan_assignments JOIN training_groups ON training_plan_assignments.school_id = training_groups.school_id JOIN athlete_groups ON training_plan_assignments.athlete_id = athlete_groups.athlete_id AND training_groups.id = athlete_groups.group_id JOIN athlete_schools ON athlete_groups.athlete_id = athlete_schools.athlete_id AND training_groups.school_id = athlete_schools.school_id WHERE training_groups.id IN coach_group_ids AND athlete_schools.ended_at IS NULL AND training_plan_assignments.withdrawn_at IS NULL
      # A coach gets the assignments of a category only for the categories of a swimmer assigned to them in the school of
      # that assignment, directly or through a group of that school (#1149): the joins bind swimmer and school.
      - SELECT training_plan_assignments.* FROM training_plan_assignments JOIN athlete_schools ON training_plan_assignments.category_id = athlete_schools.category_id AND training_plan_assignments.school_id = athlete_schools.school_id JOIN coach_athlete_assignments ON athlete_schools.athlete_id = coach_athlete_assignments.athlete_id AND athlete_schools.school_id = coach_athlete_assignments.school_id WHERE (coach_athlete_assignments.coach_user_id = auth.user_id() AND training_plan_assignments.school_id IN member_school_ids AND training_plan_assignments.withdrawn_at IS NULL) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
      - SELECT training_plan_assignments.* FROM training_plan_assignments JOIN athlete_schools ON training_plan_assignments.category_id = athlete_schools.category_id AND training_plan_assignments.school_id = athlete_schools.school_id JOIN athlete_groups ON athlete_schools.athlete_id = athlete_groups.athlete_id JOIN training_groups ON athlete_groups.group_id = training_groups.id AND athlete_schools.school_id = training_groups.school_id WHERE athlete_groups.group_id IN coach_group_ids AND training_plan_assignments.school_id IN member_school_ids AND training_plan_assignments.withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE target = 'school' AND school_id IN member_school_ids AND withdrawn_at IS NULL

  # Guardians and adult athletes: the assignments of their athletes, their groups,
  # their categories and school-wide ones, plus the assigned plan, the assigned
  # version only and its blocks. Same conditions as the select policies.
  training_plans_assignments_managed:
    auto_subscribe: true
    queries:
      - SELECT * FROM training_plan_assignments WHERE athlete_id IN managed_athlete_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE group_id IN managed_group_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE category_id IN managed_category_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plan_assignments WHERE target = 'school' AND school_id IN managed_school_ids AND withdrawn_at IS NULL
      - SELECT * FROM training_plans WHERE id IN (SELECT plan_id FROM training_plan_assignments WHERE id IN managed_assignment_ids)
      - SELECT * FROM training_plan_versions WHERE id IN (SELECT version_id FROM training_plan_assignments WHERE id IN managed_assignment_ids)
      - SELECT * FROM training_plan_blocks WHERE version_id IN (SELECT version_id FROM training_plan_assignments WHERE id IN managed_assignment_ids)

  training_plans_fulfillments:
    auto_subscribe: true
    queries:
      # Guardians and adult athletes also get the marks hidden after a withdrawal; everyone else does not.
      - SELECT * FROM training_plan_fulfillments WHERE athlete_id IN managed_athlete_ids
      # A coach gets a fulfillment only for a swimmer assigned in the school of its assignment, directly or through a
      # group of that school (#1127), so the joins bind swimmer and school, as timing_measurements does (#1122).
      - SELECT training_plan_fulfillments.* FROM training_plan_fulfillments JOIN training_plan_assignments ON training_plan_fulfillments.assignment_id = training_plan_assignments.id JOIN school_memberships ON training_plan_assignments.school_id = school_memberships.school_id JOIN athlete_schools ON training_plan_fulfillments.athlete_id = athlete_schools.athlete_id AND school_memberships.school_id = athlete_schools.school_id JOIN coach_athlete_assignments ON athlete_schools.athlete_id = coach_athlete_assignments.athlete_id AND athlete_schools.school_id = coach_athlete_assignments.school_id WHERE (school_memberships.user_id = auth.user_id() AND school_memberships.deactivated_at IS NULL AND athlete_schools.ended_at IS NULL AND coach_athlete_assignments.coach_user_id = auth.user_id() AND training_plan_fulfillments.hidden = false) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
      - SELECT training_plan_fulfillments.* FROM training_plan_fulfillments JOIN training_plan_assignments ON training_plan_fulfillments.assignment_id = training_plan_assignments.id JOIN training_groups ON training_plan_assignments.school_id = training_groups.school_id JOIN athlete_groups ON training_plan_fulfillments.athlete_id = athlete_groups.athlete_id AND training_groups.id = athlete_groups.group_id JOIN athlete_schools ON athlete_groups.athlete_id = athlete_schools.athlete_id AND training_groups.school_id = athlete_schools.school_id WHERE training_groups.id IN coach_group_ids AND athlete_schools.ended_at IS NULL AND training_plan_fulfillments.hidden = false
      # A school admin gets a fulfillment only for a swimmer of their school and an assignment of that same school
      # (#1132), so the join binds the swimmer's enrollment to the school of the assignment.
      - SELECT training_plan_fulfillments.* FROM training_plan_fulfillments JOIN training_plan_assignments ON training_plan_fulfillments.assignment_id = training_plan_assignments.id JOIN school_memberships ON training_plan_assignments.school_id = school_memberships.school_id JOIN athlete_schools ON training_plan_fulfillments.athlete_id = athlete_schools.athlete_id AND school_memberships.school_id = athlete_schools.school_id WHERE (school_memberships.user_id = auth.user_id() AND school_memberships.role = 'school_admin' AND athlete_schools.ended_at IS NULL AND training_plan_fulfillments.hidden = false) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())

  # Notes of guardians and adult athletes on a session. Only the people who manage
  # the athlete get them; coaches have no stream for them yet. The body is free text: never log it.
  training_plans_notices:
    auto_subscribe: true
    queries:
      - SELECT * FROM training_plan_notices WHERE athlete_id IN managed_athlete_ids

  # Authors see their conflicts (as the stored version's author or the one whose
  # edit was not applied); the generic record_conflicts table is how the device
  # flags the record. School admins also get the status of the conflicts of their
  # school's measurements they can read, never the values (issue #316). Platform
  # admins read the rest online.
  timing_measurement_conflicts:
    auto_subscribe: true
    queries:
      - SELECT id, 'measurements' AS table_name, measurement_id AS record_id, status FROM measurement_conflicts AS record_conflicts WHERE (incoming_by = auth.user_id()) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
      - SELECT id, 'measurements' AS table_name, measurement_id AS record_id, status FROM measurement_conflicts AS record_conflicts WHERE (current_by = auth.user_id()) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
      - SELECT record_conflicts.id, 'measurements' AS table_name, record_conflicts.measurement_id AS record_id, record_conflicts.status FROM measurement_conflicts AS record_conflicts JOIN measurements ON record_conflicts.measurement_id = measurements.id JOIN school_memberships ON measurements.school_id = school_memberships.school_id JOIN athlete_schools ON measurements.athlete_id = athlete_schools.athlete_id AND school_memberships.school_id = athlete_schools.school_id WHERE (school_memberships.user_id = auth.user_id() AND school_memberships.role = 'school_admin' AND athlete_schools.ended_at IS NULL AND measurements.hidden = false) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())

  accounts_authorization_texts:
    auto_subscribe: true
    queries:
      - SELECT * FROM authorization_texts WHERE auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())

  # Evidence syncs only to its author; school admins read it online.
  accounts_authorizations_own:
    auto_subscribe: true
    queries:
      - SELECT * FROM authorizations WHERE (user_id = auth.user_id()) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())

  accounts_authorization_status:
    auto_subscribe: true
    queries:
      - SELECT * FROM authorization_status WHERE athlete_id IN managed_athlete_ids OR athlete_id IN coach_direct_athlete_ids OR athlete_id IN coach_group_athlete_ids OR athlete_id IN admin_athlete_ids

  # The row of an athlete's photo (not the image: that is a short-lived signed URL, online) for whoever can see the athlete,
  # only while show_photo is in force (narrower than athlete_photos_select, which also lets the owner of the data read it to delete it, #1232). When it is withdrawn the row leaves every
  # device on its next sync. Platform admins have no stream, as everywhere else.
  athletes_photos:
    auto_subscribe: true
    queries:
      - SELECT * FROM athlete_photos WHERE athlete_id IN photo_managed_athlete_ids
      - SELECT * FROM athlete_photos WHERE athlete_id IN photo_coach_direct_athlete_ids
      - SELECT * FROM athlete_photos WHERE athlete_id IN photo_coach_group_athlete_ids
      - SELECT * FROM athlete_photos WHERE athlete_id IN photo_admin_athlete_ids

  # Birth date and gender of a swimmer (#1366): only the guardians and adult athletes who manage the swimmer. Coaches and school
  # admins have no query on purpose (and athletes_visible carries neither column), as athlete_private_details_select says.
  athletes_private_details:
    auto_subscribe: true
    queries:
      - SELECT * FROM athlete_private_details WHERE athlete_id IN managed_athlete_ids

  accounts_school_invitations:
    auto_subscribe: true
    queries:
      - SELECT * FROM school_invitations WHERE school_id IN admin_school_ids

  # Imported official results, their provenance and the pending differences, only for
  # guardians and adult athletes of an athlete with the import authorization in force
  # (same condition as the select policies). Nobody else gets them; they hold no
  # identity data (no document, no birth date, no key of the athlete at the source).
  results_import_imported:
    auto_subscribe: true
    queries:
      - SELECT * FROM results_imports WHERE athlete_id IN import_authorized_athlete_ids
      - SELECT * FROM imported_results WHERE athlete_id IN import_authorized_athlete_ids
      - SELECT * FROM imported_result_changes WHERE athlete_id IN import_authorized_athlete_ids

  # The catalog of tournaments of a results platform (#1339), so the picker by city and date works offline. It is public reference data
  # (results_import_tournaments_select lets any signed-in user read it), so there is no user binding: only the gate of a marked account,
  # like accounts_authorization_texts. Columns are listed so a column added later does not reach old builds by surprise.
  results_import_tournaments:
    auto_subscribe: true
    queries:
      - SELECT id, organization_id, year, date_key, name, city, discipline, course, source_url, refreshed_at FROM results_import_tournaments WHERE auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())

  # "Mis tiempos": the times a guardian or adult athlete measured themselves, only for their owner
  # (family_timing_measurements_select). Deleted ones come too, so "Eliminados" can restore them for 30 days.
  family_timing_measurements:
    auto_subscribe: true
    queries:
      - SELECT * FROM family_timing_measurements WHERE (owner_user_id = auth.user_id()) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())

  # A time sent to another swimmer's family (#973): the swimmer's family reads the request, the sender only until it
  # is accepted (#1014); an accepted one leaves the sender's device (family_timing_transfers_select).
  family_timing_transfers:
    auto_subscribe: true
    queries:
      - SELECT * FROM family_timing_transfers WHERE ((from_user_id = auth.user_id() AND status <> 'accepted') OR athlete_id IN managed_athlete_ids) AND auth.user_id() IN (SELECT user_id FROM account_sync_access WHERE user_id = auth.user_id())
